// --- Sens ---
sensitivity     "2.1"

// --- Hareket ---
bind "space"      "+jump"
bind "mwheeldown" "+jump"

// --- Ses / Voice ---
bind "v"      "+voicerecord"
bind "mouse5" "voice_modenable_toggle"

// --- Genel tuslar ---
bind "enter" "messagemode"
bind "f"     "+use"
bind "y"     "+lookatweapon"
bind "z"     "player_ping"
bind "o"     "incrementvar cl_radar_scale 0 1 0.25"

// --- Hizli satin alma ---
bind "F1" "buy vesthelm; buy vest"
bind "F2" "buy defuser"
bind "F3" "buy ak47; buy m4a1"
bind "F4" "buy deagle"
bind "F5" "buy smokegrenade"
bind "F6" "buy hegrenade"
bind "F7" "buy flashbang"
bind "F8" "buy molotov; buy incgrenade"

// --- Viewmodel ---
viewmodel_fov        "60"
viewmodel_offset_x   "-2"
viewmodel_offset_y   "2"
viewmodel_offset_z   "-2"
viewmodel_presetpos  "0"

// --- Diger ---
cl_interp_ratio "1"
con_enable      "1"

// ============================================
//  CROSSHAIRLER (ALT ile sirayla degisir)
// ============================================

// 1 - dot (nokta)
alias "set_cross1" "cl_crosshairstyle 4; cl_crosshairsize 0; cl_crosshairdot 1; cl_crosshairthickness 0.5; cl_crosshairgap -5; cl_crosshairalpha 188; cl_crosshair_drawoutline 1; cl_crosshair_outlinethickness 1; cl_crosshair_dynamic_splitdist 5; cl_crosshair_recoil false; cl_fixedcrosshairgap -10; cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_g 255; cl_crosshaircolor_b 255; cl_crosshair_t 0"

// 2 - xantares
alias "set_cross2" "cl_crosshairstyle 4; cl_crosshairsize 3.5; cl_crosshairdot 0; cl_crosshairthickness 0.1; cl_crosshairgap -1; cl_crosshairalpha 255; cl_crosshair_drawoutline 0; cl_crosshair_outlinethickness 1; cl_crosshair_dynamic_splitdist 7; cl_crosshair_recoil false; cl_fixedcrosshairgap -1; cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 0; cl_crosshaircolor_b 0; cl_crosshair_t 0"

// 3 - circle (cember)
alias "set_cross3" "cl_crosshairstyle 4; cl_crosshairsize 0.7; cl_crosshairdot 0; cl_crosshairthickness 1.6; cl_crosshairgap -5; cl_crosshairalpha 255; cl_crosshair_drawoutline 1; cl_crosshair_outlinethickness 0; cl_crosshair_recoil false; cl_fixedcrosshairgap 3; cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 0; cl_crosshaircolor_b 0; cl_crosshair_t 0"

// 4 - default (varsayilan)
alias "set_cross4" "cl_crosshairstyle 4; cl_crosshairsize 5; cl_crosshairdot 1; cl_crosshairthickness 0.6; cl_crosshairgap 0.7; cl_crosshairalpha 255; cl_crosshair_drawoutline 0; cl_crosshair_outlinethickness 1; cl_crosshair_recoil false; cl_fixedcrosshairgap 0; cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 0; cl_crosshaircolor_b 0; cl_crosshair_t 0"

// 5 - awp zoom
alias "set_cross5" "cl_crosshairstyle 4; cl_crosshairsize 35; cl_crosshairdot 0; cl_crosshairthickness 0; cl_crosshairgap -5; cl_crosshairalpha 255; cl_crosshair_drawoutline 0; cl_crosshair_outlinethickness 1; cl_crosshair_recoil 0; cl_fixedcrosshairgap 3; cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 0; cl_crosshaircolor_b 0; cl_crosshairusealpha 1; cl_crosshairgap_useweaponvalue 0; cl_crosshair_dynamic_maxdist_splitratio 1; cl_crosshair_dynamic_splitalpha_innermod 1; cl_crosshair_dynamic_splitalpha_outermod 1; cl_crosshair_dynamic_splitdist 3; cl_crosshair_t 0"

// --- Dongu (ALT tusu) ---
alias "ch_cycle" "ch_step1"
alias "ch_step1" "set_cross1; alias ch_cycle ch_step2"
alias "ch_step2" "set_cross2; alias ch_cycle ch_step3"
alias "ch_step3" "set_cross3; alias ch_cycle ch_step4"
alias "ch_step4" "set_cross4; alias ch_cycle ch_step5"
alias "ch_step5" "set_cross5; alias ch_cycle ch_step1"
bind "ALT" "ch_cycle"

host_writeconfig

